# Daily refresh of partner lists and conversion rates. Build feed follows via
# workflow_run, after verified changes are committed. Keep the workflow name
# stable: the downstream trigger matches it exactly.
name: Refresh BR ratios

on:
  # Cloudflare is the daily clock. Keep manual dispatch for recovery; do not
  # add an independent GitHub cron that would collect a second time each day.
  workflow_dispatch: {}

# contents: write for the ratio commit; issues: write because the failure
# step opens one — without it the alert about a failure fails too, which is
# the least useful possible failure mode.
permissions:
  contents: write
  issues: write

concurrency:
  group: br-ratios
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # The script is fail-safe on its own: an unreachable page, a rate it
      # cannot parse, or a listing that comes back empty leaves the existing
      # value alone. It can add and correct, never blank out. So a bad network
      # day produces an empty diff rather than a wrecked Partners tab.
      - name: Refresh partner ratios
        id: br
        continue-on-error: true
        run: node scripts/refresh-br-ratios.mjs

      # Razão de transferência não é fixa, e uma errada não quebra nada — só
      # mente. Este passo compara as razões dos bancos US contra as commitadas
      # e GRITA quando alguma mudou; a issue abaixo é o ponto todo, porque uma
      # desvalorização aplicada em silêncio é indistinguível de nada ter
      # acontecido. Diário; as razões sem scraper ainda têm um prazo separado
      # de revisão manual, conferido abaixo.
      - name: Monitor transfer ratios
        id: ratios
        continue-on-error: true
        run: |
          set +e
          node scripts/monitor-ratios.mjs 2>&1 | tee "$RUNNER_TEMP/ratio-monitor.txt"
          status=${PIPESTATUS[0]}
          set -e
          if grep -q RATIO_CHANGES_FOUND "$RUNNER_TEMP/ratio-monitor.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Refresh hotel conversion ratios
        id: hotels
        continue-on-error: true
        run: node scripts/refresh-hotel-ratios.mjs --partners sample/partners.json --report data/hotel-ratios-health.json

      - name: Refresh published point valuations
        id: valuations
        continue-on-error: true
        run: node scripts/refresh-point-valuations.mjs --partners sample/partners.json --report data/point-valuations-health.json --diagnostics-dir "$RUNNER_TEMP/valuation-diagnostics"

      - name: Refresh observed transfer times
        id: times
        continue-on-error: true
        run: node scripts/refresh-transfer-times.mjs --partners sample/partners.json --report data/transfer-times-health.json

      - name: Preserve incomplete public valuation responses for diagnosis
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: valuation-source-diagnostics
          path: ${{ runner.temp }}/valuation-diagnostics/
          retention-days: 1
          if-no-files-found: ignore

      # The tests are the gate, not the commit: bundled-partners-sync and the
      # canonical-name guard both read sample/partners.json, so a scrape that
      # introduced a duplicate or a non-canonical name fails here and never
      # reaches main.
      - name: Verify
        run: |
          node scripts/validate-feed.mjs sample/partners.json --schema partners
          npm test

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- sample/partners.json data/hotel-ratios-health.json data/point-valuations-health.json data/transfer-times-health.json)" ]; then
            echo "no ratio changes in this daily check"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sample/partners.json
            for report in data/hotel-ratios-health.json data/point-valuations-health.json data/transfer-times-health.json; do
              if [ -f "$report" ]; then git add "$report"; fi
            done
            git commit -m "chore(data): refresh partner ratios $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # A failed source preserves its saved values; verified changes from the
      # other sources still pass the schema/tests and get committed above.
      # This operational deadline is deliberately separate from npm test.
      - name: Check hand-curated ratio review dates
        id: curated
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-curated-ratios.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when a ratio moved
        if: steps.ratios.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ratio-change --color 1D76DB --description "A transfer ratio changed" 2>/dev/null || true
          {
            printf '%s\n\n' 'O scrape encontrou razões diferentes. As alterações validadas foram commitadas neste workflow. Confira se é desvalorização real e ajuste o que depender disso.'
            printf '%s\n' '```'
            cat "$RUNNER_TEMP/ratio-monitor.txt"
            printf '%s\n' '```'
          } > "$RUNNER_TEMP/ratio-issue.md"
          gh issue create \
            --title "Razão de transferência mudou: $(date -u +%F)" \
            --label ratio-change \
            --body-file "$RUNNER_TEMP/ratio-issue.md"

      - name: Report incomplete ratio verification
        if: steps.br.outcome == 'failure' || steps.ratios.outcome == 'failure' || steps.curated.outcome == 'failure' || steps.hotels.outcome == 'failure' || steps.valuations.outcome == 'failure' || steps.times.outcome == 'failure'
        run: |
          echo '::error::Daily reference verification is incomplete. Verified changes passed validation; failed sources retained their previous values and verification dates. Review the failed source above.'
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The label may not exist yet; creating it must not itself fail the
          # step, or the alert about the real failure never gets filed.
          gh label create br-ratios-failure --color B60205 --description "Daily partner ratio refresh failed" 2>/dev/null || true
          if ! gh issue list --label br-ratios-failure --state open --json number --jq '.[0]' | grep -q .; then
            gh issue create \
              --title "BR ratio refresh failed: $(date -u +%F)" \
              --label br-ratios-failure \
              --body "See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Verification was incomplete or validation failed. Successfully verified changes may have been committed; unavailable sources retained their previous values. An overdue manual review requires checking the official source before updating asOf."
          fi
