name: Build feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        id: build
        run: npm run build

      - name: Validate output
        if: success()
        run: node scripts/validate-feed.mjs out/feed.json

      - name: Commit and push feed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "feed: $(date -u +%FT%TZ)" || true
          git push

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh issue list --label pipeline-failure --state open --json number --jq '.[0]' | grep -q .; then
            gh issue create \
              --title "Pipeline failure: $(date -u +%FT%TZ)" \
              --label pipeline-failure \
              --body "The build-feed workflow failed on run ${{ github.run_id }}. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} for logs. Last known-good out/feed.json remains published; no partial data was written."
          else
            echo "An open pipeline-failure issue already exists - skipping to avoid spam."
          fi
