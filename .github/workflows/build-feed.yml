# out/ is intentionally gitignored and is never committed to the repository.
# The generated feed reaches users exclusively through the GitHub Pages
# deployment artifact (upload-pages-artifact / deploy-pages below), not via
# a git commit. Branch-based Pages can't serve a /out subdirectory anyway,
# so committing build output would be both wrong and unnecessary.
name: Build feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        id: build
        run: npm run build

      - name: Validate output
        run: node scripts/validate-feed.mjs out/feed.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh issue list --label pipeline-failure --state open --json number --jq '.[0]' | grep -q .; then
            gh issue create \
              --title "Pipeline failure: $(date -u +%FT%TZ)" \
              --label pipeline-failure \
              --body "The build-feed workflow failed on run ${{ github.run_id }}. See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} for logs. Last known-good out/feed.json remains published; no partial data was written."
          else
            echo "An open pipeline-failure issue already exists - skipping to avoid spam."
          fi

  # deploy needs: build, so a failed/aborted build (invalid data, >50% source
  # failure) never reaches deploy-pages and the previously published feed
  # stays live untouched. Do not add `if: always()` here - that would deploy
  # on build failure and defeat the fail-safe.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
